name: Update Dabanke data

on:
  schedule:
    # GitHub Actions uses UTC. 07:10/08:10 UTC = 15:10/16:10 Beijing time.
    - cron: "10 7 * * 1-5"
    - cron: "10 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dabanke-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest Dabanke review
        run: python3 scripts/fetch_dabanke.py --refresh --workers 2 --output dabanke_data.json

      - name: Commit updated data
        run: |
          git config user.name "tiantianban-bot"
          git config user.email "tiantianban-bot@users.noreply.github.com"
          git add dabanke_data.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore: update Dabanke data"
          git push
